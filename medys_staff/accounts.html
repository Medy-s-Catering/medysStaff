<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Accounts – Medy's Catering</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>

<body>
  <div class="mc-layout">
    <div id="sidebarMount"></div>
    <div class="mc-main">
      <div id="topbarMount"></div>
      <div class="mc-content">

        <div class="alert d-none" id="adminGuard"
          style="background:#fef2f2;color:#991b1b;border:1.5px solid #fca5a5;border-radius:10px;font-size:0.88rem;">
          <i class="bi bi-lock-fill me-2"></i><strong>Access Restricted.</strong> This page is for administrators only.
        </div>

        <div class="mc-section-hdr mb-4">
          <div>
            <h2 style="font-size:1.4rem;font-family:'Playfair Display',serif;">Staff Accounts</h2>
            <p style="font-size:0.82rem;color:var(--mc-gray);margin:0;">Manage system user accounts and roles</p>
          </div>
          <button class="btn-mc-primary" onclick="openModal('addAccountModal')">
            <i class="bi bi-person-plus-fill"></i> Add Staff
          </button>
        </div>

        <div class="row g-3" id="staffGrid"></div>

      </div>
    </div>
  </div>

  <!-- ADD/EDIT ACCOUNT MODAL -->
  <div class="mc-modal-overlay" id="addAccountModal">
    <div class="mc-modal">
      <div class="mc-modal-header">
        <h5 style="font-family:'Playfair Display',serif;margin:0;" id="accModalTitle">Add Staff Account</h5>
        <button class="btn-mc-icon" onclick="closeModal('addAccountModal')"><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="mc-modal-body">
        <!--
        DATABASE NOTE:
        POST /api/accounts (create) or PUT /api/accounts/:id (update)
        Table: users(id, full_name, username, email, role, status, created_at)
        Password should be hashed server-side using bcrypt.
      -->
        <div class="row g-3">
          <input type="hidden" id="accEditId" />
          <div class="col-md-6">
            <label class="mc-label">Full Name *</label>
            <input type="text" id="accName" class="mc-input" placeholder="Full name" />
          </div>
          <div class="col-md-6">
            <label class="mc-label">Username *</label>
            <input type="text" id="accUsername" class="mc-input" placeholder="Login username" />
          </div>
          <div class="col-md-6">
            <label class="mc-label">Email</label>
            <input type="email" id="accEmail" class="mc-input" placeholder="email@example.com" />
          </div>
          <div class="col-md-6">
            <label class="mc-label">Role *</label>
            <select id="accRole" class="mc-input">
              <option value="staff">Staff</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="mc-label">Password *</label>
            <input type="password" id="accPassword" class="mc-input" placeholder="Set password" />
          </div>
          <div class="col-md-6">
            <label class="mc-label">Status</label>
            <select id="accStatus" class="mc-input">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
      </div>
      <div class="mc-modal-footer">
        <button class="btn-mc-ghost" onclick="closeModal('addAccountModal')">Cancel</button>
        <button class="btn-mc-primary" onclick="saveAccount()"><i class="bi bi-check-lg"></i> Save Account</button>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    // Mock staff data — replace with fetch from /api/accounts
    const MC_STAFF = [
      { id: 1, name: 'Admin User', username: 'admin', email: 'admin@medyscatering.com', role: 'admin', status: 'active' },
      { id: 2, name: 'Staff User', username: 'staff', email: 'staff@medyscatering.com', role: 'staff', status: 'active' },
      { id: 3, name: 'Maria Reyes', username: 'maria', email: 'maria@medyscatering.com', role: 'staff', status: 'active' },
      { id: 4, name: 'Juan Dela Cruz', username: 'juan', email: 'juan@medyscatering.com', role: 'staff', status: 'inactive' },
    ];

    function initials(name) {
      return name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
    }

    function renderStaff() {
      document.getElementById('staffGrid').innerHTML = MC_STAFF.map(s => `
    <div class="col-md-6 col-lg-4 col-xl-3">
      <div class="mc-card text-center" style="border:${s.status == 'inactive' ? '1.5px dashed #e5e7eb' : ''};opacity:${s.status == 'inactive' ? '0.7' : ''}"}>
        <div style="width:64px;height:64px;border-radius:50%;background:${s.role == 'admin' ? 'var(--mc-red)' : 'var(--mc-blue)'};display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;color:#fff;margin:0 auto 1rem;font-family:'Playfair Display',serif;">${initials(s.name)}</div>
        <div style="font-weight:700;font-size:1rem;margin-bottom:0.2rem;">${s.name}</div>
        <div style="font-size:0.8rem;color:var(--mc-gray);margin-bottom:0.6rem;">@${s.username}</div>
        <div style="font-size:0.78rem;color:var(--mc-gray);margin-bottom:0.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${s.email}">${s.email}</div>
        <div style="display:flex;gap:0.4rem;justify-content:center;margin-bottom:0.9rem;">
          <span class="mc-badge ${s.role == 'admin' ? 'mc-badge-admin' : 'mc-badge-staff'}">${s.role == 'admin' ? 'Admin' : 'Staff'}</span>
          <span class="mc-badge ${s.status == 'active' ? 'mc-badge-confirmed' : 'mc-badge-cancelled'}">${s.status}</span>
        </div>
        <div style="display:flex;gap:0.5rem;justify-content:center;">
          <button class="btn-mc-ghost" onclick="editAccount(${s.id})"><i class="bi bi-pencil-fill"></i> Edit</button>
          <button class="btn-mc-icon danger" onclick="deleteAccount(${s.id})" title="Remove"><i class="bi bi-trash-fill"></i></button>
        </div>
      </div>
    </div>`).join('');
    }

    function editAccount(id) {
      const s = MC_STAFF.find(x => x.id == id);
      if (!s) return;
      document.getElementById('accModalTitle').textContent = 'Edit Staff Account';
      document.getElementById('accEditId').value = id;
      document.getElementById('accName').value = s.name;
      document.getElementById('accUsername').value = s.username;
      document.getElementById('accEmail').value = s.email;
      document.getElementById('accRole').value = s.role;
      document.getElementById('accStatus').value = s.status;
      document.getElementById('accPassword').value = '';
      openModal('addAccountModal');
    }

    function saveAccount() {
      const id = document.getElementById('accEditId').value;
      const name = document.getElementById('accName').value.trim();
      const user = document.getElementById('accUsername').value.trim();
      if (!name || !user) { showToast('Name and username are required.', 'error'); return; }
      /* DATABASE NOTE: POST /api/accounts or PUT /api/accounts/:id */
      if (id) {
        const idx = MC_STAFF.findIndex(x => x.id == parseInt(id));
        MC_STAFF[idx] = {
          ...MC_STAFF[idx], name, username: user,
          email: document.getElementById('accEmail').value,
          role: document.getElementById('accRole').value,
          status: document.getElementById('accStatus').value
        };
        showToast('Account updated!');
      } else {
        MC_STAFF.push({
          id: MC_STAFF.length + 1, name, username: user,
          email: document.getElementById('accEmail').value,
          role: document.getElementById('accRole').value,
          status: document.getElementById('accStatus').value
        });
        showToast('Staff account created!');
      }
      closeModal('addAccountModal');
      document.getElementById('accEditId').value = '';
      document.getElementById('accModalTitle').textContent = 'Add Staff Account';
      renderStaff();
    }

    function deleteAccount(id) {
      if (id == 1) { showToast('Cannot delete the main admin account.', 'error'); return; }
      if (!confirm('Remove this staff account?')) return;
      /* DATABASE NOTE: DELETE /api/accounts/:id */
      const idx = MC_STAFF.findIndex(x => x.id == id);
      MC_STAFF.splice(idx, 1);
      renderStaff(); showToast('Account removed.', 'error');
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('sidebarMount').outerHTML = renderSidebar('accounts');
      document.getElementById('topbarMount').outerHTML = renderTopbar('Staff Accounts', "Medy's Catering › Accounts");
      initSidebar();
      // Show guard if not admin
      if (MC_DATA.currentUser.role != 'admin') {
        document.getElementById('adminGuard').classList.remove('d-none');
        document.getElementById('staffGrid').innerHTML = '';
        return;
      }
      renderStaff();
    });
  </script>
</body>

</html>

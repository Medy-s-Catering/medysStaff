<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Medy's Catering Staff Portal</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    .login-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
    }

    .login-divider span {
      font-size: 0.78rem;
      color: #aaa;
      white-space: nowrap;
    }

    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    .pw-toggle {
      position: absolute;
      right: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 1rem;
    }

    .pw-toggle:hover {
      color: var(--mc-red);
    }

    .role-tab {
      flex: 1;
      padding: 0.55rem;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.2s;
      color: #aaa;
    }

    .role-tab.active {
      background: var(--mc-red);
      color: #fff;
      box-shadow: 0 3px 10px rgba(192, 57, 43, 0.3);
    }
  </style>
</head>

<body>

  <div class="login-page">
    <div class="login-card">

      <div class="login-logo">
        <div class="login-logo-icon"><i class="bi bi-award-fill"></i></div>
        <h2>Medy's Catering</h2>
        <p>Staff Management Portal</p>
      </div>

      <div style="display:flex; gap:4px; background:#f3f4f6; border-radius:10px; padding:4px; margin-bottom:1.5rem;">
        <div class="role-tab active" onclick="selectRole('admin',this)">Admin</div>
        <div class="role-tab" onclick="selectRole('staff',this)">Staff</div>
      </div>

      <!-- LOGIN FORM -->
      <!--
      DATABASE NOTE:
      On submit, POST { username, password, role } to your backend auth endpoint.
      Example: POST /api/auth/login
      On success, store JWT token in sessionStorage and redirect to dashboard.html
      Backend should verify credentials against your users table (MySQL).
    -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="mc-label">Username</label>
          <input type="text" id="username" class="mc-input" placeholder="Enter your username" required />
        </div>
        <div class="mb-1 position-relative">
          <label class="mc-label">Password</label>
          <div style="position:relative;">
            <input type="password" id="password" class="mc-input" placeholder="Enter your password"
              style="padding-right:2.5rem;" required />
            <button type="button" class="pw-toggle" onclick="togglePw()"><i class="bi bi-eye-fill"
                id="pwIcon"></i></button>
          </div>
        </div>
        <div class="d-flex justify-content-end mb-3">
          <a href="#" style="font-size:0.8rem;color:var(--mc-red);font-weight:600;">Forgot password?</a>
        </div>

        <div id="loginError" class="alert alert-danger py-2 d-none" style="font-size:0.85rem;">
          <i class="bi bi-exclamation-triangle-fill me-1"></i> Invalid username or password.
        </div>

        <button type="submit" class="btn-mc-primary w-100 justify-content-center" style="padding:0.75rem;">
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>
      </form>

      <div class="login-divider"><span>Demo credentials</span></div>
      <div
        style="background:#f9fafb; border-radius:10px; padding:0.9rem; font-size:0.8rem; color:#555; line-height:1.9;">
        <!-- REMOVE this demo block in production -->
        <strong>Admin:</strong> admin / admin123<br>
        <strong>Staff:</strong> staff / staff123
      </div>


    </div>
  </div>

  <script>
    let selectedRole = 'admin';

    function selectRole(role, el) {
      selectedRole = role;
      document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
  
      document.getElementById('loginError').classList.add('d-none');
    }

    function togglePw() {
      const pw   = document.getElementById('password');
      const icon = document.getElementById('pwIcon');
      const show = pw.type === 'password';
      pw.type        = show ? 'text' : 'password';
      icon.className = show ? 'bi bi-eye-slash-fill' : 'bi bi-eye-fill';
    }

    function handleLogin(e) {
      e.preventDefault();
      const u   = document.getElementById('username').value.trim();
      const p   = document.getElementById('password').value;
      const err = document.getElementById('loginError');

      // /* =====================================================
      //    DATABASE NOTE (replace entire block below for production):

      //    WHAT TO REPLACE:
      //      Remove the "Mock auth" block and the demo credentials div above.

      //    REPLACE WITH:
      //      const res = await fetch('/api/auth/login', {
      //        method: 'POST',
      //        headers: { 'Content-Type': 'application/json' },
      //        body: JSON.stringify({ username: u, password: p, role: selectedRole })
      //      });
      //      const data = await res.json();
      //      if (data.token) {
      //        sessionStorage.clear();
      //        sessionStorage.setItem('mc_token', data.token);      // JWT token
      //        sessionStorage.setItem('mc_user', JSON.stringify(data.user)); // { name, role, initials }
      //        window.location.href = 'dashboard.html';
      //      } else {
      //        err.classList.remove('d-none');
      //      }

      //    ALSO REMOVE:
      //      - The demo credentials <div> block above (marked <!-- REMOVE this demo block in production -->)
      //      - The login-divider and demo div above the closing </div>
      //    ===================================================== */

      // /* ── MOCK AUTH — REMOVE IN PRODUCTION ──
      //    Each role has its own fixed credentials.
      //    Staff can ONLY log in as staff; admin can ONLY log in as admin.
      //    The selectedRole variable ensures the correct role is always saved to session.
      // */
      const accounts = {
        admin: { username: 'admin', password: 'admin123', name: 'Admin User', initials: 'AU' },
        staff: { username: 'staff', password: 'staff123', name: 'Staff User', initials: 'SU' },
      };

      const account = accounts[selectedRole];
      const valid   = account && u == account.username && p == account.password;

      if (valid) {
        sessionStorage.clear(); 
        sessionStorage.setItem('mc_user', JSON.stringify({
          name:     account.name,
          role:     selectedRole,   
          initials: account.initials
        }));
        window.location.href = 'dashboard.html';
      } else {
        err.classList.remove('d-none');
        document.getElementById('password').value = ''; 
      }
    }

    (function checkExistingSession() {
      if (sessionStorage.getItem('mc_user')) {
        window.location.replace('dashboard.html');
      }
    })();
  </script>
</body>

</html>
